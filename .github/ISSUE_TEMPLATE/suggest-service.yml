name: Suggest a free-tier service
description: Suggest a service or report changed terms, category, or provider logo
title: "[Catalog] "
labels: ["documentation"]
body:
  - type: input
    id: service
    attributes:
      label: Provider and product
      placeholder: "Example: ExampleHost Free"
    validations:
      required: true
  - type: input
    id: official
    attributes:
      label: Official pricing or documentation URL
      placeholder: "https://..."
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Request
      options:
        - Add new service
        - Update limits or terms
        - Remove discontinued free tier
        - Correct category or provider logo
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment model of this specific offer
      description: Choose based on the official source, not other editions sold by the vendor.
      options:
        - Not confirmed
        - Cloud (provider-hosted)
        - Self-hosted (your server)
        - Cloud + self-hosted (both in this offer)
        - Local / embedded (desktop, CLI, SDK, library)
  - type: textarea
    id: details
    attributes:
      label: Evidence and important restrictions
      description: For plan changes, include allowance, expiry, card, commercial use, deployment evidence, and the date verified. For logo/category corrections, include the service name or ID, expected category or official product homepage, and a filtered directory URL if relevant.
    validations:
      required: true
