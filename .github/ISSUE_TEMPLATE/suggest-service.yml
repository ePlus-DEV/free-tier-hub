name: Suggest a free-tier service
description: Suggest a new service or request a correction without writing JSON or creating a PR
title: "[Catalog] "
labels: ["documentation"]
body:
  - type: input
    id: service
    attributes:
      label: Provider and product
      placeholder: "Example: ExampleHost Free"
    validations:
      required: true
  - type: input
    id: official
    attributes:
      label: Official pricing or documentation URL
      placeholder: "https://..."
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Request
      options:
        - Add new service
        - Update limits or terms
        - Remove discontinued free tier
        - Correct category or provider logo
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment model of this specific offer
      description: Choose based on the official source, not other editions sold by the vendor.
      options:
        - Not confirmed
        - Cloud (provider-hosted)
        - Self-hosted (your server)
        - Cloud + self-hosted (both in this offer)
        - Local / embedded (desktop, CLI, SDK, library)
  - type: textarea
    id: details
    attributes:
      label: Evidence and important restrictions
      description: For plan changes, include allowance (with units and reset period), trial/expiry, card, commercial use, deployment evidence, and the date you personally checked the official source. For existing services, include the current service ID or URL and the exact field to change. For logo/category corrections, include the expected category or official product homepage. You do not need to edit data/services.json or prepare JSON; maintainers review the suggestion and preserve contributor credit when a PR is involved.
    validations:
      required: true
