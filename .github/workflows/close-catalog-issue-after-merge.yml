name: Close catalog issue after merge

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  close-delivered-issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Thank contributor on merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          marker="<!-- free-tier-hub-merge-thanks -->"
          existing="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)"
          if [ -z "$existing" ]; then
            gh pr comment "$PR_NUMBER" --body "$(printf '%s\\n' "$marker" "Thank you @$PR_AUTHOR for contributing to Free Tier Hub! 🎉" "" "This PR has been merged successfully. Your contribution helps keep the free-tier catalog useful and up to date. 💚")"
          fi

      - name: Close linked catalog issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [[ "$PR_BODY" =~ Automated[[:space:]]delivery[[:space:]]from[[:space:]]candidate[[:space:]]issue[[:space:]]\#([0-9]+) ]]; then
            issue="${BASH_REMATCH[1]}"
          else
            echo "No catalog candidate issue reference; nothing to close."
            exit 0
          fi
          title="$(gh issue view "$issue" --json title --jq '.title')"
          if [[ "$title" != "[catalog-candidate] "* ]]; then
            echo "Linked issue is not a catalog candidate; skipping."
            exit 0
          fi
          state="$(gh issue view "$issue" --json state --jq '.state')"
          if [[ "$state" == "OPEN" ]]; then
            gh issue comment "$issue" --body "Completed by merged PR $PR_URL."
            gh issue close "$issue" --reason completed
          fi
