name: Catalog candidate queue

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing catalog candidate issue number to retry'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

# Serialize delivery capacity decisions across candidate issues. Superseded pending
# workflow runs remain recoverable from their canonical candidate Issues.
concurrency:
  group: catalog-candidate-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, '[catalog-candidate] ') && (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '{"deployment_model"')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Load candidate issue
        if: github.event_name == 'workflow_dispatch'
        id: queued_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid candidate Issue number"; exit 1; }
          # gh issue view --json does not expose authorAssociation.
          # REST returns the authoritative author_association field.
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > /tmp/issue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const issue = JSON.parse(fs.readFileSync('/tmp/issue.json', 'utf8'));
          if (issue.state !== 'open' || issue.pull_request) throw Error('Candidate Issue is not an open Issue');
          if (!issue.title.startsWith('[catalog-candidate] ')) throw Error('Not a catalog candidate issue');
          if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)) throw Error('Untrusted submitter');
          const delimiter = 'BODY_' + crypto.randomUUID();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'body<<' + delimiter + '\n' + issue.body + '\n' + delimiter + '\n');
          NODE

      - name: Trust gate
        if: github.event_name != 'workflow_dispatch'
        env:
          ASSOCIATION: ${{ github.event.issue.author_association }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) ;; *) exit 1 ;; esac
          if [ "$EVENT_NAME" = issue_comment ]; then
            case "$COMMENT_ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) ;; *) exit 1 ;; esac
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      # A canonical candidate Issue contains exactly ten catalog fields.
      # A trusted JSON Issue comment supplies independently sourced deployment
      # evidence without changing that payload. Old eleven-field Issues still work.
      - name: Resolve deployment evidence
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          ISSUE_BODY: ${{ github.event_name == 'workflow_dispatch' && steps.queued_issue.outputs.body || github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > /tmp/issue-candidate.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > /tmp/candidate-comments.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateCandidate } from './scripts/catalog.mjs';
          import { resolveCandidateDeployment } from './scripts/candidate-deployment.mjs';
          const original = JSON.parse(fs.readFileSync('/tmp/issue-candidate.json', 'utf8'));
          validateCandidate(original);
          const comments = JSON.parse(fs.readFileSync('/tmp/candidate-comments.json', 'utf8')).flat();
          const candidate = resolveCandidateDeployment(original, comments);
          if (!candidate) {
            console.log('::notice::Waiting for trusted deployment evidence comment; no branch or PR created');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=false\n');
          } else {
            validateCandidate(candidate);
            fs.writeFileSync('/tmp/candidate.json', JSON.stringify(candidate));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
          }
          NODE

      - name: Validate bot token before mutations
        if: steps.deployment.outputs.ready == 'true'
        env:
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          test -n "$BOT_TOKEN" || { echo "::error::Configure EPLUS_BOT_TOKEN with contents:write permission to trigger PR checks"; exit 1; }

      - name: Parse candidate
        if: steps.deployment.outputs.ready == 'true'
        id: candidate
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateData, validateCandidate } from './scripts/catalog.mjs';
          const candidate = JSON.parse(fs.readFileSync('/tmp/candidate.json', 'utf8'));
          validateCandidate(candidate);
          const services = JSON.parse(fs.readFileSync('data/services.json', 'utf8'));
          validateData([...services, candidate]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'id=' + candidate.id + '\nbranch=catalog/add-' + candidate.id + '\n');
          NODE

      - name: Enforce active catalog PR limit
        if: steps.deployment.outputs.ready == 'true'
        id: capacity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open_count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("catalog/add-")) | .number' \
            | wc -l | tr -d '[:space:]')"
          if [ "$open_count" -ge 3 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$open_count catalog PRs open; leave this candidate Issue queued for later retry."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update source data
        if: steps.capacity.outputs.available == 'true'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateData } from './scripts/catalog.mjs';
          const candidate = JSON.parse(fs.readFileSync('/tmp/candidate.json', 'utf8'));
          const catalog = 'data/services.json';
          const services = JSON.parse(fs.readFileSync(catalog, 'utf8'));
          validateData([...services, candidate]);
          // Site builder supports safe initials fallback for newly catalogued IDs.
          fs.writeFileSync(catalog, JSON.stringify([...services, candidate], null, 2) + '\n');
          NODE

      - name: Generate and validate
        if: steps.capacity.outputs.available == 'true'
        run: |
          set -euo pipefail
          npm run catalog:sync
          npm run catalog:check
          git diff --check

      - name: Prepare delivery branch and commit
        if: steps.capacity.outputs.available == 'true'
        env:
          DELIVERY_BRANCH: ${{ steps.candidate.outputs.branch }}
          SERVICE_ID: ${{ steps.candidate.outputs.id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fail closed if a branch already exists. Never rewrite contributor history.
          if git ls-remote --exit-code --heads origin "$DELIVERY_BRANCH" >/dev/null; then
            echo "::error::Branch $DELIVERY_BRANCH already exists; review or finish its existing PR instead of overwriting it"
            exit 1
          fi
          git switch -c "$DELIVERY_BRANCH"
          git add data/services.json README.md docs/
          git commit -m "catalog: add $SERVICE_ID"
          # The added-date site tests inspect committed Git history. Run the
          # complete verification only after the local commit exists, but
          # always before publishing the branch to the remote.
          npm run verify
          git show --format= --check HEAD
          git push origin "HEAD:refs/heads/$DELIVERY_BRANCH"

      - name: Open or reuse PR
        if: steps.capacity.outputs.available == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_BRANCH: ${{ steps.candidate.outputs.branch }}
          SERVICE_ID: ${{ steps.candidate.outputs.id }}
        run: |
          set -euo pipefail
          url="$(gh pr list --state open --head "$DELIVERY_BRANCH" --json url --jq '.[0].url // empty')"
          if [ -z "$url" ]; then
            url="$(gh pr create --base main --head "$DELIVERY_BRANCH" --title "catalog: add ${SERVICE_ID//-/ }" --body "Automated delivery from candidate issue #${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}. Catalog generation and validation passed before opening this PR.")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Trigger PR checks with bot token
        if: steps.capacity.outputs.available == 'true'
        env:
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
          DELIVERY_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DELIVERY_BRANCH"
          git switch -C "$DELIVERY_BRANCH" "origin/$DELIVERY_BRANCH"
          git config user.name "eplus-bot"
          git config user.email "eplus-bot@users.noreply.github.com"
          git commit --allow-empty -m "ci: trigger catalog PR validation"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -c credential.helper= push "https://x-access-token:$BOT_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$DELIVERY_BRANCH"


      - name: Link delivery PR to issue
        if: steps.capacity.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          ISSUE_NUMBER="${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}"
          gh issue comment "$ISSUE_NUMBER" --body "Delivery PR created: $PR_URL. This issue stays open until the PR is merged."
