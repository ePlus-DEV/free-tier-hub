name: Catalog candidate queue

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing catalog candidate issue number to retry'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: catalog-candidate-${{ github.event_name }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[catalog-candidate] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load candidate issue
        if: github.event_name == 'workflow_dispatch'
        id: queued_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json title,body,authorAssociation > /tmp/issue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const issue = JSON.parse(fs.readFileSync('/tmp/issue.json', 'utf8'));
          if (!issue.title.startsWith('[catalog-candidate] ')) throw Error('Not a catalog candidate issue');
          if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.authorAssociation)) throw Error('Untrusted submitter');
          const delimiter = 'BODY_' + crypto.randomUUID();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'body<<' + delimiter + '\n' + issue.body + '\n' + delimiter + '\n');
          NODE

      - name: Trust gate
        if: github.event_name == 'issues'
        env:
          ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) ;; *) exit 1 ;; esac

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Parse candidate
        id: candidate
        env:
          ISSUE_BODY: ${{ github.event_name == 'workflow_dispatch' && steps.queued_issue.outputs.body || github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > /tmp/candidate.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateData } from './scripts/catalog.mjs';
          const candidate = JSON.parse(fs.readFileSync('/tmp/candidate.json', 'utf8'));
          const fields = ['id', 'name', 'category', 'plan', 'free_limit', 'watch_out',
            'pricing_url', 'credit_card', 'commercial_use', 'last_checked'];
          if (Object.keys(candidate).sort().join() !== fields.sort().join()) {
            throw Error('Candidate must contain exactly the catalog schema fields');
          }
          const services = JSON.parse(fs.readFileSync('data/services.json', 'utf8'));
          validateData([...services, candidate]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'id=' + candidate.id + '\nbranch=catalog/add-' + candidate.id + '\n');
          NODE

      - name: Update source data
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateData } from './scripts/catalog.mjs';
          const candidate = JSON.parse(fs.readFileSync('/tmp/candidate.json', 'utf8'));
          const catalog = 'data/services.json';
          const services = JSON.parse(fs.readFileSync(catalog, 'utf8'));
          validateData([...services, candidate]);
          // Site builder supports safe initials fallback for newly catalogued IDs.
          fs.writeFileSync(catalog, JSON.stringify([...services, candidate], null, 2) + '\n');
          NODE

      - name: Generate and validate
        run: |
          set -euo pipefail
          npm run catalog:sync
          npm run verify
          git diff --check

      - name: Prepare canonical branch
        id: branch
        env:
          DELIVERY_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin main "$DELIVERY_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$DELIVERY_BRANCH"; then
            AHEAD="$(git rev-list --count origin/main..origin/$DELIVERY_BRANCH)"
            if [ "$AHEAD" -ne 0 ]; then
              echo "Canonical branch has $AHEAD unique commit(s); refusing to overwrite"
              exit 2
            fi
            git switch -C "$DELIVERY_BRANCH" origin/main
            echo "mode=reused-empty" >> "$GITHUB_OUTPUT"
          else
            git switch -c "$DELIVERY_BRANCH" origin/main
            echo "mode=created" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit delivery branch
        env:
          DELIVERY_BRANCH: ${{ steps.candidate.outputs.branch }}
          SERVICE_ID: ${{ steps.candidate.outputs.id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/services.json README.md docs/
          git commit -m "catalog: add $SERVICE_ID"
          # --force-with-lease is only used for a verified Ahead=0 stale canonical branch.
          if [ "${{ steps.branch.outputs.mode }}" = "reused-empty" ]; then
            git push --force-with-lease origin "$DELIVERY_BRANCH"
          else
            git push origin "$DELIVERY_BRANCH"
          fi

      - name: Open or reuse PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_BRANCH: ${{ steps.candidate.outputs.branch }}
          SERVICE_ID: ${{ steps.candidate.outputs.id }}
        run: |
          set -euo pipefail
          url="$(gh pr list --state open --head "$DELIVERY_BRANCH" --json url --jq '.[0].url // empty')"
          if [ -z "$url" ]; then
            url="$(gh pr create --base main --head "$DELIVERY_BRANCH" --title "catalog: add ${SERVICE_ID//-/ }" --body "Automated delivery from candidate issue #${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}. Catalog generation and validation passed before opening this PR.")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Trigger PR checks with bot token
        env:
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
          DELIVERY_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN" || { echo "::error::EPLUS_BOT_TOKEN is missing"; exit 1; }
          git fetch origin "$DELIVERY_BRANCH"
          git switch -C "$DELIVERY_BRANCH" "origin/$DELIVERY_BRANCH"
          git config user.name "eplus-bot"
          git config user.email "eplus-bot@users.noreply.github.com"
          git commit --allow-empty -m "ci: trigger catalog PR validation"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:$BOT_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$DELIVERY_BRANCH"


      - name: Link delivery PR to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          ISSUE_NUMBER="${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}"
          gh issue comment "$ISSUE_NUMBER" --body "Delivery PR created: $PR_URL. This issue stays open until the PR is merged."
