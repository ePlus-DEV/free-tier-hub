name: Catalog candidate queue

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open [catalog-candidate] Issue number (for example 1857; not a PR number)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

# Serialize delivery capacity decisions across candidate issues. Superseded pending
# workflow runs remain recoverable from their canonical candidate Issues.
concurrency:
  group: catalog-candidate-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, '[catalog-candidate] ') && (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '{"deployment_model"')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Load candidate issue
        if: github.event_name == 'workflow_dispatch'
        id: queued_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid candidate Issue number"; exit 1; }
          # gh issue view --json does not expose authorAssociation.
          # REST returns the authoritative author_association field.
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > /tmp/issue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const issue = JSON.parse(fs.readFileSync('/tmp/issue.json', 'utf8'));
          if (issue.pull_request) throw Error(`Issue #${issue.number} is a pull request, not a candidate Issue`);
          if (issue.state !== 'open') throw Error(`Issue #${issue.number} is ${issue.state}; select an OPEN [catalog-candidate] Issue`);
          if (!issue.title.startsWith('[catalog-candidate] ')) throw Error(`Issue #${issue.number} is not a [catalog-candidate] Issue`);
          if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)) throw Error(`Issue #${issue.number} has an untrusted submitter`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Candidate delivery retry\nIssue: [#${issue.number}](${issue.html_url}) (${issue.state})\n\n`);
          const delimiter = 'BODY_' + crypto.randomUUID();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'body<<' + delimiter + '\n' + issue.body + '\n' + delimiter + '\n');
          NODE

      - name: Trust gate
        if: github.event_name != 'workflow_dispatch'
        env:
          ASSOCIATION: ${{ github.event.issue.author_association }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) ;; *) exit 1 ;; esac
          if [ "$EVENT_NAME" = issue_comment ]; then
            case "$COMMENT_ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) ;; *) exit 1 ;; esac
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      # A canonical candidate Issue contains exactly ten catalog fields.
      # A trusted JSON Issue comment supplies independently sourced deployment
      # evidence without changing that payload. Old eleven-field Issues still work.
      - name: Resolve deployment evidence
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          ISSUE_BODY: ${{ github.event_name == 'workflow_dispatch' && steps.queued_issue.outputs.body || github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > /tmp/issue-candidate.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > /tmp/candidate-comments.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateCandidate } from './scripts/catalog.mjs';
          import { resolveCandidateDeployment } from './scripts/candidate-deployment.mjs';
          const original = JSON.parse(fs.readFileSync('/tmp/issue-candidate.json', 'utf8'));
          validateCandidate(original);
          const comments = JSON.parse(fs.readFileSync('/tmp/candidate-comments.json', 'utf8')).flat();
          const candidate = resolveCandidateDeployment(original, comments);
          if (!candidate) {
            console.log('::notice::Waiting for trusted deployment evidence comment; no branch or PR created');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'No Draft PR: missing valid trusted deployment evidence comment. Add the exact deployment JSON comment and retry.\n');
            if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
              throw Error('Manual delivery blocked: missing valid trusted deployment evidence comment');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=false\n');
          } else {
            validateCandidate(candidate);
            fs.writeFileSync('/tmp/candidate.json', JSON.stringify(candidate));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
          }
          NODE

      - name: Validate bot token before mutations
        if: steps.deployment.outputs.ready == 'true'
        env:
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          test -n "$BOT_TOKEN" || { echo "::error::Configure EPLUS_BOT_TOKEN with contents:write permission to trigger PR checks"; exit 1; }

      - name: Parse candidate
        if: steps.deployment.outputs.ready == 'true'
        id: candidate
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateData, validateCandidate } from './scripts/catalog.mjs';
          import { loadServices } from './scripts/catalog-source.mjs';
          import { candidateCollisions, dedupMessage } from './scripts/catalog-dedup.mjs';
          const candidate = JSON.parse(fs.readFileSync('/tmp/candidate.json', 'utf8'));
          validateCandidate(candidate);
          const overlaps = candidateCollisions(candidate, loadServices());
          if (overlaps.length) {
            throw Error('Candidate requires duplicate review: ' + dedupMessage(candidate, overlaps));
          }
          validateData([...loadServices(), candidate]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'id=' + candidate.id + '\nbranch=catalog/add-' + candidate.id + '\n');
          NODE

      - name: Enforce active catalog PR limit
        if: steps.deployment.outputs.ready == 'true'
        id: capacity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open_count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("catalog/add-")) | .number' \
            | wc -l | tr -d '[:space:]')"
          if [ "$open_count" -ge 3 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$open_count catalog PRs open; leave this candidate Issue queued for later retry."
          else
            # The candidate may already be covered by a maintainer batch PR
            # whose branch is NOT named catalog/add-<id>. Prevent duplicate PRs.
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { proposedServiceIds } from './scripts/catalog-pr-coverage.mjs';
          const repo = process.env.GITHUB_REPOSITORY;
          const candidate = JSON.parse(fs.readFileSync('/tmp/candidate.json', 'utf8'));
          const api = endpoint => JSON.parse(execFileSync('gh', [
            'api', '--paginate', '--slurp', 'repos/' + repo + '/' + endpoint
          ], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 })).flat();
          const openPRs = api('pulls?state=open&per_page=100');
          const pending = proposedServiceIds(openPRs, pr =>
            api('pulls/' + pr.number + '/files?per_page=100'));
          const alreadyCovered = pending.has(candidate.id);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'available=' + (alreadyCovered ? 'false' : 'true') + '\n');
          if (alreadyCovered) {
            console.log('::notice::Service ' + candidate.id +
              ' is already proposed in an open PR; leave candidate Issue queued.');
          }
          NODE
          fi

      - name: Update source data
        if: steps.capacity.outputs.available == 'true'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateData } from './scripts/catalog.mjs';
          import { loadServices, writeService } from './scripts/catalog-source.mjs';
          const candidate = JSON.parse(fs.readFileSync('/tmp/candidate.json', 'utf8'));
          validateData([...loadServices(), candidate]);
          // Only the new service shard is canonical; aggregate and docs are generated.
          writeService(process.cwd(), candidate);
          NODE

      - name: Generate and validate
        if: steps.capacity.outputs.available == 'true'
        run: |
          set -euo pipefail
          npm run catalog:sync
          npm run catalog:check
          git diff --check

      - name: Prepare delivery branch and commit
        if: steps.capacity.outputs.available == 'true'
        env:
          DELIVERY_BRANCH: ${{ steps.candidate.outputs.branch }}
          SERVICE_ID: ${{ steps.candidate.outputs.id }}
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Recover a previous delivery that pushed its branch but failed before
          # opening a PR. Never rewrite the remote branch or contributor history.
          if git ls-remote --exit-code --heads origin "$DELIVERY_BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$DELIVERY_BRANCH:refs/remotes/origin/$DELIVERY_BRANCH"
            EXPECTED_SHARD="data/services/$(node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("/tmp/candidate.json","utf8")); process.stdout.write(c.category+"/"+c.id+".json")')"
            ACTUAL_FILES="$(git diff --name-only "origin/main...origin/$DELIVERY_BRANCH")"
            if [ "$ACTUAL_FILES" != "$EXPECTED_SHARD" ]; then
              echo "::error::Existing branch $DELIVERY_BRANCH has unexpected changes; manual review required"
              exit 1
            fi
            EXPECTED_SHARD="$EXPECTED_SHARD" DELIVERY_BRANCH="$DELIVERY_BRANCH" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const expected = JSON.parse(fs.readFileSync('/tmp/candidate.json', 'utf8'));
          const actual = JSON.parse(execFileSync('git', ['show',
            'origin/' + process.env.DELIVERY_BRANCH + ':' + process.env.EXPECTED_SHARD],
            { encoding: 'utf8' }));
          if (JSON.stringify(Object.entries(expected).sort()) !==
              JSON.stringify(Object.entries(actual).sort())) {
            throw Error('Existing branch shard differs from validated candidate; manual review required');
          }
          NODE
            echo "Reusing existing validated delivery branch $DELIVERY_BRANCH without pushing"
            exit 0
          fi
          git switch -c "$DELIVERY_BRANCH"
          git add -- data/services/
          git commit -m "catalog: add $SERVICE_ID"
          # The added-date site tests inspect committed Git history. Run the
          # complete verification only after the local commit exists, but
          # always before publishing the branch to the remote.
          npm run verify
          git show --format= --check HEAD
          # Use the bot token so the branch push and subsequent PR events trigger CI.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -c credential.helper= push "https://x-access-token:$BOT_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$DELIVERY_BRANCH"

      # Candidate PRs start Draft. The separate event-driven gate may publish
      # only trusted, verified OSS candidates after both exact-head CI runs pass.
      - name: Open or reuse PR
        if: steps.capacity.outputs.available == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
          DELIVERY_BRANCH: ${{ steps.candidate.outputs.branch }}
          SERVICE_ID: ${{ steps.candidate.outputs.id }}
        run: |
          set -euo pipefail
          url="$(gh pr list --state open --head "$DELIVERY_BRANCH" --json url --jq '.[0].url // empty')"
          if [ -z "$url" ]; then
            url="$(gh pr create --draft --base main --head "$DELIVERY_BRANCH" --title "catalog: add ${SERVICE_ID//-/ }" --body "Automated delivery from candidate issue #${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}. Catalog generation and validation passed before opening this PR.")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Draft PR: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Link delivery PR to issue
        if: steps.capacity.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          ISSUE_NUMBER="${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}"
          gh issue comment "$ISSUE_NUMBER" --body "Delivery PR created: $PR_URL. This issue stays open until the PR is merged."
