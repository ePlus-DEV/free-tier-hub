name: Gate verified catalog auto-merge

on:
  workflow_run:
    workflows:
      - Validate free tier catalog
      - Build and deploy GitHub Pages
    types: [completed]
  # Muse Invite Hub-style reconciliation catches a missed workflow_run event
  # and retries a verified PR left Ready after an interrupted merge.
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

# All merges target main: serialize different PRs and periodic retries together.
concurrency:
  group: catalog-gated-merge-main
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.event == 'pull_request' &&
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Verify bot credentials
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: test -n "$GH_TOKEN"
      - name: Check exact-head CI and guarded merge
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: node scripts/catalog-event-auto-merge.mjs
