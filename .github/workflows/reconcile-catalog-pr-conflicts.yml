name: Reconcile catalog PR conflicts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-catalog-pr-conflicts.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reconcile-catalog-pr-conflicts
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Rebuild each catalog PR on latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN" || { echo "::error::EPLUS_BOT_TOKEN missing"; exit 1; }
          git config user.name "eplus-bot"
          git config user.email "eplus-bot@users.noreply.github.com"
          gh pr list --state open --limit 200 --json number,author,headRefName,baseRefName,isDraft,body |
          jq -c '.[] | select(.author.login == "github-actions[bot]" and .baseRefName == "main" and .isDraft == false and (.headRefName | startswith("catalog/add-")) and (.body | startswith("Automated delivery from candidate issue #")))' > /tmp/eligible-catalog-prs.jsonl
          failed=0
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            branch="$(jq -r '.headRefName' <<<"$pr")"
            id="${branch#catalog/add-}"
            echo "::group::Reconcile PR #$number ($id)"
            git fetch origin main "$branch"
            old_head="$(git rev-parse "origin/$branch")"
            git switch -C "reconcile-$number" origin/main
            if ! SERVICE_ID="$id" OLD_BRANCH="origin/$branch" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { validateData } from './scripts/catalog.mjs';
          const id = process.env.SERVICE_ID;
          const previous = JSON.parse(execFileSync('git', ['show', process.env.OLD_BRANCH + ':data/services.json'], {encoding: 'utf8'}));
          const matches = previous.filter(item => item.id === id);
          if (matches.length !== 1) throw Error('Expected exactly one matching service');
          const path = 'data/services.json';
          const current = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (current.some(item => item.id === id)) throw Error('Service already on main; skip rather than duplicate');
          validateData([...current, matches[0]]);
          fs.writeFileSync(path, JSON.stringify([...current, matches[0]], null, 2) + '\n');
          NODE
            then
              echo "::error::PR #$number: cannot safely extract candidate"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi
            npm run catalog:sync
            npm run verify
            git diff --check
            git add data/services.json README.md docs/
            if git diff --cached --quiet; then
              echo "::notice::No changes for PR #$number"
              echo "::endgroup::"
              continue
            fi
            git commit -m "catalog: reconcile $id with latest main"
            # The PR author stays github-actions[bot], allowing eplus-bot to review.
            # Force-with-lease rejects concurrent edits; never overwrite a moving branch.
            git push --force-with-lease="refs/heads/$branch:$old_head" \
              "https://x-access-token:$BOT_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
              "HEAD:refs/heads/$branch"
            echo "::endgroup::"
          done < /tmp/eligible-catalog-prs.jsonl
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed PR(s) require manual reconciliation"
            exit 1
          fi
