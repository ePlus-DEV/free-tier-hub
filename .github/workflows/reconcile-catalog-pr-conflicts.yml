name: Maintain catalog PRs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/services.json'
      - 'scripts/service-added-at.mjs'
      - '.github/workflows/reconcile-catalog-pr-conflicts.yml'
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: maintain-catalog-prs
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Reconcile one verified data-only conflicting catalog PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN" || { echo "::error::EPLUS_BOT_TOKEN missing"; exit 1; }

          # Use REST login for bot-authored PRs. GitHub's GraphQL bot
          # representation differs and previously selected zero PRs.
          candidates="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
            jq -r '[.[][]] | sort_by(.number)[] |
              select(.user.login == "github-actions[bot]" and .draft == false and
                     .base.ref == "main" and
                     .head.repo.full_name == env.GITHUB_REPOSITORY and
                     (.head.ref | startswith("catalog/add-")) and
                     (.body | startswith("Automated delivery from candidate issue #"))) |
              [.number, .head.ref, .head.sha] | @tsv')"

          if [ -z "$candidates" ]; then
            echo "No eligible catalog PRs found."
            exit 0
          fi

          while IFS=$'\t' read -r number branch expected_head; do
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            # GitHub may return mergeable=null while it recomputes mergeability
            # immediately after a main push. Wait briefly, but fail closed:
            # never reconcile unless GitHub explicitly reports false (dirty).
            for attempt in 1 2 3 4 5; do
              if jq -e '.mergeable != null' <<<"$pr" >/dev/null; then
                break
              fi
              echo "::notice::PR #$number mergeability pending (attempt $attempt/5)"
              sleep 2
              pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            done
            if ! jq -e --arg head "$expected_head" --arg branch "$branch" \
              '.state == "open" and .draft == false and .mergeable == false and
               .user.login == "github-actions[bot]" and
               .head.ref == $branch and .head.sha == $head and
               .head.repo.full_name == env.GITHUB_REPOSITORY and
               .base.ref == "main"' <<<"$pr" >/dev/null; then
              continue
            fi
            echo "::group::Reconcile catalog PR #$number"

            # Only the source record and generated docs may be modified.
            changed="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100" --jq '.[].filename')"
            if [ -z "$changed" ] ||
               grep -Ev '^(data/services\.json|README\.md|docs/[a-z0-9-]+\.md)$' <<<"$changed"; then
              echo "::notice::PR #$number has non-catalog changes; manual review required"
              echo "::endgroup::"
              continue
            fi

            issue_number="$(jq -r '.body | capture("^Automated delivery from candidate issue #(?<n>[0-9]+)\\.").n // empty' <<<"$pr")"
            if ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
              echo "::endgroup::"
              continue
            fi
            id="$(printf '%s' "$branch" | sed 's|^catalog/add-||')"
            issue="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number")"
            if ! jq -e --arg title "[catalog-candidate] $id" --arg id "$id" \
              '.state == "open" and .pull_request == null and .title == $title and
               (.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") and
               ((.body | fromjson).id == $id)' <<<"$issue" >/dev/null; then
              echo "::notice::Candidate Issue for PR #$number needs manual review"
              echo "::endgroup::"
              continue
            fi

            git fetch --no-tags origin main "refs/heads/$branch"
            old_head="$(git rev-parse "origin/$branch")"
            if [ "$old_head" != "$expected_head" ]; then
              echo "::notice::PR #$number changed while inspecting; retry later"
              echo "::endgroup::"
              continue
            fi
            base="$(git merge-base origin/main "$old_head")"
            git show "$base:data/services.json" > /tmp/catalog-base.json
            git show "$old_head:data/services.json" > /tmp/catalog-branch.json
            git show "origin/main:data/services.json" > /tmp/catalog-main.json
            jq -r '.body' <<<"$issue" > /tmp/catalog-candidate.json
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100" > /tmp/catalog-candidate-comments.json

            # The queue may have attached verified deployment metadata from a
            # trusted comment to a canonical ten-field Issue. Reconstruct that
            # exact entry before comparing or reconciling; never drop the model.
            if ! node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateCandidate } from './scripts/catalog.mjs';
          import { resolveCandidateDeployment } from './scripts/candidate-deployment.mjs';
          const path = '/tmp/catalog-candidate.json';
          const original = validateCandidate(JSON.parse(fs.readFileSync(path, 'utf8')));
          const comments = JSON.parse(fs.readFileSync('/tmp/catalog-candidate-comments.json', 'utf8')).flat();
          const resolved = resolveCandidateDeployment(original, comments);
          if (!resolved) throw Error('No trusted deployment evidence for candidate');
          validateCandidate(resolved);
          fs.writeFileSync(path, JSON.stringify(resolved));
          NODE
            then
              echo "::notice::Candidate Issue for PR #$number lacks trusted deployment evidence"
              echo "::endgroup::"
              continue
            fi

            # Confirm that the branch's ONLY data change versus its original base
            # is the exact candidate recorded in the trusted Issue. Reject stale
            # pricing and already-delivered IDs. No service entry is discarded.
            if ! node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateData, validateCandidate } from './scripts/catalog.mjs';
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const original = read('/tmp/catalog-base.json');
          const branch = read('/tmp/catalog-branch.json');
          const main = read('/tmp/catalog-main.json');
          const candidate = validateCandidate(read('/tmp/catalog-candidate.json'));
          const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          const date = Date.parse(candidate.last_checked + 'T00:00:00Z');
          const now = Date.now();
          if (!Number.isFinite(date) || date > now || now - date > 8 * 86400000) {
            throw Error('Stale or future candidate verification date');
          }
          if (branch.length !== original.length + 1 ||
              !original.every((entry, i) => same(entry, branch[i])) ||
              !same(branch.at(-1), candidate) ||
              main.some(item => item.id === candidate.id)) {
            throw Error('Branch contains more changes than the canonical candidate, or candidate is delivered');
          }
          validateData([...main, candidate]);
          NODE
            then
              echo "::notice::PR #$number contains an unsafe or stale change; manual review required"
              echo "::endgroup::"
              continue
            fi

            # Preserve BOTH branch and latest main ancestry using a merge commit.
            # An 'ours' merge alone is not enough: restore the complete latest main
            # tree and reapply only the verified candidate, then regenerate docs.
            git switch -C "catalog-reconcile-$number" "$old_head"
            git -c user.name='eplus-bot' -c user.email='eplus-bot@users.noreply.github.com' \
              merge --no-ff --no-commit -s ours origin/main
            git restore --source=origin/main --staged --worktree -- .
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateData } from './scripts/catalog.mjs';
          const catalog = 'data/services.json';
          const services = JSON.parse(fs.readFileSync(catalog, 'utf8'));
          const candidate = JSON.parse(fs.readFileSync('/tmp/catalog-candidate.json', 'utf8'));
          validateData([...services, candidate]);
          fs.writeFileSync(catalog, JSON.stringify([...services, candidate], null, 2) + '\n');
          NODE
            npm run catalog:sync
            npm run verify
            node --check site/assets/site.js
            git add -A
            git diff --cached --check

            # Reject any resulting file outside the data/generated-docs scope.
            diff_files="$(git diff --name-only origin/main)"
            if [ -z "$diff_files" ] ||
               grep -Ev '^(data/services\.json|README\.md|docs/[a-z0-9-]+\.md)$' <<<"$diff_files"; then
              echo "::error::Unexpected files after reconciliation; no push"
              exit 1
            fi
            git -c user.name='eplus-bot' -c user.email='eplus-bot@users.noreply.github.com' \
              commit -m "catalog: safely reconcile PR #$number with latest main"
            git -c credential.helper= push \
              "https://x-access-token:$BOT_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
              "HEAD:refs/heads/$branch"
            echo "::notice::Reconciled PR #$number; exact-head CI and bot approval must still pass"
            echo "::endgroup::"
            exit 0
          done <<<"$candidates"

          echo "No safely reconcilable PR. Other PRs require manual inspection."

  recover:
    # Only run after the conflict pass, with a clean checkout and fresh PR head.
    # Draft PRs remain excluded from both recovery paths.
    needs: reconcile
    if: ${{ needs.reconcile.result == 'success' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Reactivate one verified non-conflicting catalog PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN" || { echo "::error::Missing EPLUS_BOT_TOKEN"; exit 1; }

          # GitHub REST uses github-actions[bot]; GraphQL/gh pr list can
          # represent the same actor differently. Read REST directly.
          candidates="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
            jq -r '[.[][]] | sort_by(.number)[] |
              select(.user.login == "github-actions[bot]" and
                     .draft == false and
                     .base.ref == "main" and
                     .head.repo.full_name == env.GITHUB_REPOSITORY and
                     (.head.ref | startswith("catalog/add-")) and
                     (.body | startswith("Automated delivery from candidate issue #"))) |
              [.number, .head.ref, .head.sha] | @tsv')"

          if [ -z "$candidates" ]; then
            echo "No trusted catalog backlog PRs."
            exit 0
          fi

          while IFS=$'\t' read -r number branch expected_head; do
            echo "::group::Inspect PR #$number ($branch)"

            # Validate the current PR snapshot; never work from a stale list.
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            if ! jq -e --arg head "$expected_head" --arg branch "$branch" \
              '.state == "open" and .mergeable == true and .draft == false and
               .user.login == "github-actions[bot]" and
               .head.sha == $head and .head.ref == $branch and
               .base.ref == "main"' <<<"$pr" >/dev/null; then
              echo "::notice::PR #$number is conflicted, stale, or ineligible."
              echo "::endgroup::"
              continue
            fi

            issue_number="$(jq -r '.body | capture("^Automated delivery from candidate issue #(?<n>[0-9]+)\\.").n // empty' <<<"$pr")"
            [[ "$issue_number" =~ ^[0-9]+$ ]] || { echo "::endgroup::"; continue; }
            id="${branch#catalog/add-}"
            issue="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number")"
            if ! jq -e --arg title "[catalog-candidate] $id" --arg id "$id" \
              '.state == "open" and .title == $title and .pull_request == null and
               (.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") and
               ((.body | fromjson).id == $id)' <<<"$issue" >/dev/null; then
              echo "::notice::Candidate Issue validation failed for #$number"
              echo "::endgroup::"
              continue
            fi

            # Do not deliver stale terms or a service already on main.
            checked="$(jq -r '.body | fromjson | .last_checked' <<<"$issue")"
            checked_sec="$(date -u -d "$checked" +%s 2>/dev/null || echo 0)"
            now_sec="$(date -u +%s)"
            if [ "$checked_sec" -eq 0 ] || [ "$checked_sec" -gt "$now_sec" ] ||
               [ "$((now_sec - checked_sec))" -gt 604800 ] ||
               jq -e --arg id "$id" 'any(.[]; .id == $id)' data/services.json >/dev/null; then
              echo "::notice::PR #$number needs renewed pricing verification or is already catalogued."
              echo "::endgroup::"
              continue
            fi

            changed="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100" --jq '.[].filename')"
            if [ -z "$changed" ] ||
               grep -Ev '^(data/services\.json|README\.md|docs/[a-z0-9-]+\.md)$' <<<"$changed"; then
              echo "::notice::PR #$number has files outside catalog allowlist."
              echo "::endgroup::"
              continue
            fi

            last_message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$expected_head" --jq '.commit.message')"
            if [[ "$last_message" == "ci: reactivate catalog PR #"* ]]; then
              echo "::notice::PR #$number was already reactivated; no duplicate commits."
              echo "::endgroup::"
              continue
            fi

            git fetch --no-tags origin "refs/heads/$branch"
            actual_head="$(git rev-parse FETCH_HEAD)"
            if [ "$actual_head" != "$expected_head" ]; then
              echo "::notice::PR #$number changed concurrently; will retry later."
              echo "::endgroup::"
              continue
            fi

            # Empty, ancestry-preserving commit triggers exact-head PR CI using
            # eplus-bot PAT (GITHUB_TOKEN pushes do not trigger new workflows).
            # Existing review/security rules and auto-merge workflow decide merge.
            git switch -C "recover-$number" "$actual_head"
            git -c user.name='eplus-bot' -c user.email='eplus-bot@users.noreply.github.com' \
              commit --allow-empty -m "ci: reactivate catalog PR #$number"
            git -c credential.helper= push \
              "https://x-access-token:$BOT_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
              "HEAD:refs/heads/$branch"
            echo "::notice::Reactivated PR #$number; exact-head CI and bot approval must pass."
            echo "::endgroup::"
            exit 0
          done <<<"$candidates"

          echo "No safely reactivatable PR found. Conflicted PRs require separate reconciliation."
