name: Reconcile catalog PR conflicts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-catalog-pr-conflicts.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reconcile-catalog-pr-conflicts
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Reconcile only by non-force ancestry-preserving merges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN" || { echo "::error::EPLUS_BOT_TOKEN missing"; exit 1; }
          git config user.name "eplus-bot"
          git config user.email "eplus-bot@users.noreply.github.com"
          gh pr list --state open --limit 200 --json number,author,headRefName,baseRefName,isDraft,body |
          jq -c '.[] | select(.author.login == "github-actions[bot]" and .baseRefName == "main" and .isDraft == false and (.headRefName | startswith("catalog/add-")) and (.body | startswith("Automated delivery from candidate issue #")))' > /tmp/eligible-catalog-prs.jsonl
          failed=0
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            branch="$(jq -r '.headRefName' <<<"$pr")"
            echo "::group::Reconcile PR #$number ($branch)"
            git fetch origin main "$branch"
            old_head="$(git rev-parse "origin/$branch")"
            if git merge-base --is-ancestor origin/main "origin/$branch"; then
              echo "::notice::PR #$number already includes current main"
              echo "::endgroup::"
              continue
            fi
            # Start from the actual PR head; never rebuild from main or discard unique commits.
            git switch -C "reconcile-$number" "origin/$branch"
            # Conflicts are not auto-resolved: fail closed for human review.
            if ! git merge --no-commit --no-ff origin/main; then
              git merge --abort || true
              echo "::error::PR #$number conflicts with main; head $old_head unchanged"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi
            if ! npm run catalog:sync || ! npm run verify || ! git diff --check; then
              git merge --abort || true
              echo "::error::PR #$number failed verification; no remote update"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi
            git add data/services.json README.md docs/
            git commit -m "catalog: merge latest main into PR #$number (preserve ancestry)"
            # Normal push is fast-forward from the original head. Concurrent edits reject it.
            if ! git -c credential.helper= push \
              "https://x-access-token:$BOT_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
              "HEAD:refs/heads/$branch"; then
              echo "::error::PR #$number moved or push denied; no force retry"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done < /tmp/eligible-catalog-prs.jsonl
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed PR(s) require safe manual reconciliation"
            exit 1
          fi
