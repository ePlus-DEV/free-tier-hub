name: Validate free tier catalog
on:
  pull_request:
    paths:
      - README.md
      - CONTRIBUTING.md
      - data/**
      - docs/**
      - scripts/**
      - tests/**
      - package.json
      - .github/workflows/validate-catalog.yml
  push:
    branches: [main, 'catalog/**']
    paths:
      - README.md
      - data/**
      - docs/**
      - scripts/**
      - tests/**
      - .github/workflows/validate-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-tier-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify catalog and generated Markdown with Node.js
        run: npm run verify
