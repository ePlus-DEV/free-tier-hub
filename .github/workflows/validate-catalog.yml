name: Validate free tier catalog
on:
  pull_request:
    paths:
      - README.md
      - LICENSE
      - LICENSE-DATA.md
      - AGENTS.md
      - agent.md
      - CONTRIBUTING.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/ISSUE_TEMPLATE/**
      - data/**
      - docs/**
      - scripts/**
      - tests/**
      - package.json
      - .nvmrc
      - .github/workflows/**
  push:
    branches: [main, 'catalog/**']
    paths:
      - README.md
      - LICENSE
      - LICENSE-DATA.md
      - AGENTS.md
      - agent.md
      - CONTRIBUTING.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/ISSUE_TEMPLATE/**
      - data/**
      - docs/**
      - scripts/**
      - tests/**
      - package.json
      - .nvmrc
      - .github/workflows/validate-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-tier-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Reject legacy monolith edits in pull requests
        run: node scripts/validate-catalog-pr.mjs
      - name: Regenerate category documentation in CI
        run: npm run catalog:sync
      - name: Verify catalog and generated Markdown with Node.js
        run: npm run verify
