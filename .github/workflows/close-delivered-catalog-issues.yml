name: Close delivered catalog candidate issues

on:
  push:
    branches: [main]
    paths:
      - 'data/services.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: close-delivered-catalog-issues
  cancel-in-progress: false

jobs:
  close-delivered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Close only catalogued candidate issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { closeCataloguedIssue } from './scripts/close-catalogued-issue.mjs';
          const repo = process.env.GITHUB_REPOSITORY;
          const catalog = JSON.parse(fs.readFileSync('data/services.json', 'utf8'));
          const ids = new Set(catalog.map(item => item.id));
          let page = 1;
          while (true) {
            const raw = execFileSync('gh', ['api', '--method', 'GET', `repos/${repo}/issues`,
              '-f', 'state=open', '-f', 'per_page=100', '-f', `page=${page}`], {encoding:'utf8'});
            const issues = JSON.parse(raw).filter(issue => !issue.pull_request);
            for (const issue of issues) {
              const match = /^\[catalog-candidate\] ([a-z0-9]+(?:-[a-z0-9]+)*)$/.exec(issue.title);
              if (!match || !ids.has(match[1])) continue;
              let candidate;
              try { candidate = JSON.parse(issue.body || ''); } catch { continue; }
              if (candidate.id !== match[1]) continue;
              const message = `Catalog entry \`${match[1]}\` is present on main at \`${process.env.GITHUB_SHA}\`. Closing this candidate as delivered. Production visibility still depends on a successful GitHub Pages deployment.`;
              const outcome = closeCataloguedIssue(repo, issue.number, message);
              console.log(`${outcome === 'already-closed' ? 'Already closed' : 'Closed'} #${issue.number}: ${match[1]}`);
            }
            if (JSON.parse(raw).length < 100) break;
            page++;
          }
          NODE
