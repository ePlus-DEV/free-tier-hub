name: Retrigger existing catalog PRs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retrigger-catalog-prs.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Re-trigger catalog PR checks with bot PAT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN" || { echo "::error::EPLUS_BOT_TOKEN is missing"; exit 1; }
          gh pr list --state open --limit 100 --json number,author,headRefName,baseRefName,isDraft,body > /tmp/open-prs.json
          jq -c '.[] | select(.author.login == "github-actions[bot]" and .baseRefName == "main" and .isDraft == false and (.headRefName | startswith("catalog/add-")) and (.body | startswith("Automated delivery from candidate issue #")))' /tmp/open-prs.json |
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            branch="$(jq -r '.headRefName' <<<"$pr")"
            echo "Re-triggering PR #$number ($branch)"
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch -C "$branch" "refs/remotes/origin/$branch"
            git config user.name "eplus-bot"
            git config user.email "eplus-bot@users.noreply.github.com"
            git commit --allow-empty -m "ci: retrigger validation for PR #$number"
            git push "https://x-access-token:$BOT_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          done
