name: Reconcile catalog PR approvals

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reconcile-catalog-pr-approvals
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Approve and merge eligible catalog PRs as eplus-bot
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = "eplus-bot" || { echo "::error::Expected eplus-bot token"; exit 1; }
          gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[]' | jq -s '.' > /tmp/catalog-prs.json
          echo "Open PRs discovered: $(jq length /tmp/catalog-prs.json)"
          jq -c '.[] | select(.user.login == "github-actions[bot]" or .user.login == "hoangsvit") | select(.base.ref == "main" and .draft == false and (.head.ref | startswith("catalog/add-")) and ((.body // "") | startswith("Automated delivery from candidate issue #")))' /tmp/catalog-prs.json > /tmp/eligible-catalog-prs.jsonl
          echo "Matching catalog PRs: $(wc -l < /tmp/eligible-catalog-prs.jsonl)"
          if [ ! -s /tmp/eligible-catalog-prs.jsonl ]; then
            echo "::notice::No matching catalog PRs; nothing to reconcile."
          fi
          failed=0
          while IFS= read -r item; do
            number="$(jq -r .number <<<"$item")"
            echo "Checking catalog PR #$number"
            pr="$(gh api "repos/$GH_REPO/pulls/$number")"
            head="$(jq -r '.head.sha' <<<"$pr")"
            test "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$GH_REPO" || { echo "::notice::PR #$number skipped: fork"; continue; }
            # GitHub REST may return mergeable=null until its asynchronous mergeability check finishes.
            mergeable="$(jq -r '.mergeable' <<<"$pr")"
            for attempt in 1 2 3 4 5 6; do
              [ "$mergeable" != "null" ] && break
              sleep 2
              pr="$(gh api "repos/$GH_REPO/pulls/$number")"
              mergeable="$(jq -r '.mergeable' <<<"$pr")"
            done
            if [ "$mergeable" != "true" ]; then
              echo "::error::PR #$number blocked: mergeable=$mergeable, mergeable_state=$(jq -r '.mergeable_state' <<<"$pr"). Run Reconcile catalog PR conflicts first."
              failed=$((failed + 1))
              continue
            fi
            checks="$(gh pr checks "$number" --repo "$GH_REPO" --json bucket,name,workflow)" || { echo "::notice::PR #$number skipped: unable to read checks"; continue; }
            jq -e 'any(.[]; .workflow == "Validate free tier catalog" and .bucket == "pass")' <<<"$checks" >/dev/null || { echo "::notice::PR #$number skipped: catalog validation missing or not passing"; continue; }
            jq -e 'all(.[]; .workflow == "pr-auto-approve" or .workflow == "Reconcile catalog PR approvals" or .bucket == "pass" or .bucket == "skipping")' <<<"$checks" >/dev/null || { echo "::notice::PR #$number skipped: checks not all passing"; continue; }
            latest="$(gh api "repos/$GH_REPO/pulls/$number" --jq .head.sha)"
            test "$latest" = "$head" || continue
            approved="$(gh api "repos/$GH_REPO/pulls/$number/reviews" --paginate --jq ".[] | select(.user.login == \"eplus-bot\" and .state == \"APPROVED\" and .commit_id == \"$head\") | .id" | tail -n 1)"
            if [ -z "$approved" ]; then
              gh pr review "$number" --repo "$GH_REPO" --approve --body "Approved by @eplus-bot after all PR checks passed."
            fi
            gh pr merge "$number" --repo "$GH_REPO" --squash --match-head-commit "$head"
          done < /tmp/eligible-catalog-prs.jsonl
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed catalog PR(s) remain conflicted or blocked."
            exit 1
          fi
