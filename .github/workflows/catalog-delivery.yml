name: Catalog delivery

on:
  push:
    branches:
      - 'catalog/**'
    paths:
      - 'data/services.json'
      - 'scripts/build_site.py'
  workflow_dispatch:
    inputs:
      branch:
        description: Existing catalog delivery branch to synchronize
        required: true
        type: string
      pr_title:
        description: Optional pull request title
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-delivery-${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELIVERY_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
    steps:
      - name: Validate branch
        shell: bash
        run: |
          set -euo pipefail
          case "$DELIVERY_BRANCH" in
            catalog/*) ;;
            *) echo "Only catalog/* branches are allowed"; exit 1 ;;
          esac

      - name: Check out delivery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DELIVERY_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize generated catalog files
        run: python3 scripts/sync_catalog.py

      - name: Validate synchronized catalog
        run: |
          set -euo pipefail
          python3 scripts/sync_catalog.py --check
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_catalog.py

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Generated files already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/
          git diff --cached --check
          git commit -m "chore: sync generated catalog files"
          git push origin "HEAD:$DELIVERY_BRANCH"

      - name: Create pull request if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE_INPUT: ${{ inputs.pr_title }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --state open --head "$DELIVERY_BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists."
            exit 0
          fi
          title="$PR_TITLE_INPUT"
          if [ -z "$title" ]; then
            service="${DELIVERY_BRANCH#catalog/add-}"
            service="${service%-v2}"
            title="catalog: add ${service//-/ }"
          fi
          gh pr create             --base main             --head "$DELIVERY_BRANCH"             --title "$title"             --body "Automated catalog delivery. Generated Markdown was synchronized and repository validation passed before this PR was opened."
