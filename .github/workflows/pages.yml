name: Build and deploy GitHub Pages

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - 'README.md'
      - 'LICENSE'
      - 'LICENSE-DATA.md'
      - 'AGENTS.md'
      - 'agent.md'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - 'README.md'
      - 'LICENSE'
      - 'LICENSE-DATA.md'
      - 'AGENTS.md'
      - 'agent.md'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/pages.yml'
  # SVG badges are static snapshots: refresh the rolling 48h count even without merges.
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Isolate PR builds from main deployments. GitHub cancels older pending runs
# within a shared group even when cancel-in-progress is false.
# Main/dispatch/schedule use the SAME repository-wide group as the preview publisher.
# Separate PR-only build runs from deployments to prevent one Pages release
# from overwriting the other workflow's preview snapshot.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('github-pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    name: Test and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js for catalog verification
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Regenerate category documentation in CI
        run: node scripts/validate-catalog-pr.mjs && npm run catalog:sync
      # The independent Validate free tier catalog workflow owns the full test suite.
      # Pages owns built-site verification and SEO checks to avoid duplicate runs.
      - name: Validate catalog source before site build
        run: npm run catalog:check
      - name: Validate browser script syntax
        run: node --check site/assets/site.js
      - name: Assert Node-only repository automation
        run: |
          if find scripts -type f -name '*.py' | grep -q .; then
            echo 'Python scripts remain under scripts/' >&2
            exit 1
          fi
          if grep -REn 'setup-p[y]thon|p[y]thon3' .github/workflows; then
            echo 'Workflow still invokes Python' >&2
            exit 1
          fi
      - name: Build HTML, sitemap and agent discovery
        env:
          SITE_URL: https://free-tier.eplus.dev/
        run: npm run build
      - name: Verify generated site assets
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/llms.txt
          test -s dist/agents.md
          test -s dist/catalog.json
          test -s dist/catalog-stats.json
          test -s dist/badges/services.svg
          test -s dist/badges/free-tiers.svg
          test -s dist/badges/limited-offers.svg
          test -s dist/badges/new-48h.svg
          test -s dist/search/index.json
          test -s dist/search/cards/static-hosting.json
          test -s dist/badges/categories/static-hosting.svg
          test -f dist/.nojekyll
      - name: Verify public-domain SEO URLs
        run: |
          grep -Fq 'rel="canonical" href="https://free-tier.eplus.dev/"' dist/index.html
          grep -Fq '<loc>https://free-tier.eplus.dev/' dist/sitemap.xml
          grep -Fq 'Sitemap: https://free-tier.eplus.dev/sitemap.xml' dist/robots.txt
          grep -Fq 'https://free-tier.eplus.dev/catalog.json' dist/llms.txt
          grep -Fq 'https://free-tier.eplus.dev/catalog.json' dist/agents.md
      - name: Prepare offline PR design preview
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-preview.mjs --site dist --base-url https://free-tier.eplus.dev/
      - name: Upload downloadable PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: free-tier-hub-pr-preview
          path: dist/
          retention-days: 14
      - name: Include current open PR previews in production bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-pr-previews.mjs dist
      # Fork PRs only generate documents in the ephemeral runner workspace.
      # After a reviewed merge, persist derived docs to main with GITHUB_TOKEN.
      # GITHUB_TOKEN pushes do not launch another workflow run.
      - name: Commit generated category documentation on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add -u -- 'docs/*.md' data/services.json
          if git diff --cached --quiet; then
            echo 'Category documentation already matches source data.'
            exit 0
          fi
          # Never overwrite newer main changes from another merged PR.
          REMOTE_HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo '::error::main changed during CI; regenerate docs from the latest commit.'
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs(catalog): regenerate category tables [skip ci]'
          git push origin HEAD:refs/heads/main
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
    steps:
      # GitHub Pages may still be finalizing a previous successful deployment
      # after the Actions run has finished. Retry only when the first attempt
      # fails; never treat a failed deployment as a successful job.
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying a failed Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - name: Retry GitHub Pages deployment once
        if: steps.deployment.outcome == 'failure'
        id: retry_deployment
        uses: actions/deploy-pages@v4
      - name: Checkout canonical catalog for live verification
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Verify deployed search index matches canonical shards
        env:
          PUBLIC_INDEX_URL: https://free-tier.eplus.dev/search/index.json
        run: |
          node --input-type=module <<'NODE'
          import { loadServices } from './scripts/catalog-source.mjs';
          const expected = new Set(loadServices().map(service => service.id));
          let failure = '';
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const response = await fetch(process.env.PUBLIC_INDEX_URL + '?verify=' + process.env.GITHUB_SHA + '-' + attempt, {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) throw Error('HTTP ' + response.status);
              const index = await response.json();
              if (!Array.isArray(index.rows)) throw Error('Missing search rows');
              const actual = new Set(index.rows.map(row => row[0]));
              const missing = [...expected].filter(id => !actual.has(id));
              const extra = [...actual].filter(id => !expected.has(id));
              if (!missing.length && !extra.length && actual.size === index.rows.length) {
                console.log('Live search index verified: ' + actual.size + ' services');
                process.exit(0);
              }
              failure = 'Missing: ' + missing.slice(0, 10).join(', ') + '; unexpected: ' + extra.slice(0, 10).join(', ');
            } catch (error) { failure = error.message; }
            console.log('Live catalog verification attempt ' + attempt + '/6: ' + failure);
            if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 15000));
          }
          console.error('::error::Deployed search index does not match canonical main catalog: ' + failure);
          process.exit(1);
          NODE
      - name: Verify deployed README badge, stats and Home totals
        env:
          PUBLIC_ORIGIN: https://free-tier.eplus.dev/
        run: |
          node --input-type=module <<'NODE'
          import { loadServices } from './scripts/catalog-source.mjs';
          import { compactNumber } from './site/assets/compact-numbers.js';
          const entries = loadServices();
          const expected = entries.filter(item => item.plan === 'ongoing' || item.plan === 'monthly-credit').length;
          const expectedLimited = entries.length - expected;
          const display = compactNumber(entries.length);
          const freeDisplay = compactNumber(expected);
          const limitedDisplay = compactNumber(expectedLimited);
          let failure = '';
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const suffix = '?verify=' + process.env.GITHUB_SHA + '-' + attempt;
              const urls = ['catalog-stats.json', 'badges/services.svg', 'badges/free-tiers.svg',
                'badges/limited-offers.svg', ''];
              const results = await Promise.all(urls.map(async file => {
                const response = await fetch(process.env.PUBLIC_ORIGIN + file + suffix, {
                  headers: { 'Cache-Control': 'no-cache' },
                  signal: AbortSignal.timeout(15000),
                });
                if (!response.ok) throw Error(file + ': HTTP ' + response.status);
                return response;
              }));
              const [stats, badge, freeBadge, limitedBadge, home] = await Promise.all([
                results[0].json(), results[1].text(), results[2].text(), results[3].text(), results[4].text()
              ]);
              if (stats.free_tier_count !== expected ||
                  stats.limited_offer_count !== expectedLimited ||
                  stats.total_services !== entries.length) throw Error('Deployed catalog stats do not match main');
              const expectedBadges = [
                [badge, entries.length, display, 'services'],
                [freeBadge, expected, freeDisplay, 'free tiers'],
                [limitedBadge, expectedLimited, limitedDisplay, 'limited offers'],
              ];
              for (const [svg, count, number, label] of expectedBadges) {
                if (!svg.includes('<title>' + count + ' ' + label + '</title>') ||
                    !svg.includes('>' + number + '</text>')) {
                  throw Error('Deployed ' + label + ' badge SVG is stale or invalid');
                }
              }
              if (home.includes('class="hero-stats"') ||
                  !home.includes('<span class="result-label">All services</span><strong class="result-total">' + display + '</strong>') ||
                  !home.includes('<select id="offer-filter"><option value="">All services (' + display + ')</option>') ||
                  !home.includes('<option value="free">Free tiers (' + freeDisplay + ')</option>') ||
                  !home.includes('<option value="limited">Time-limited &amp; expiring offers (' + limitedDisplay + ')</option>') ||
                  !home.includes('<span class="result-shown">Showing ' + compactNumber(Math.min(12, expected)) + ' of ' + display + '</span>')) {
                throw Error('Home filter counts or right-aligned result count do not match README badges');
              }
              console.log('Live service badges verified:', entries.length, 'all;',
                expected, 'ongoing and recurring;', expectedLimited, 'limited');
              process.exit(0);
            } catch (error) { failure = error.message; }
            console.log('Badge verification attempt ' + attempt + '/6: ' + failure);
            if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 15000));
          }
          console.error('::error::Deployed README badge or stats do not match Home: ' + failure);
          process.exit(1);
          NODE
      - name: Require a successful Pages deployment
        if: always()
        env:
          FIRST_OUTCOME: ${{ steps.deployment.outcome }}
          RETRY_OUTCOME: ${{ steps.retry_deployment.outcome }}
        run: |
          if [ "$FIRST_OUTCOME" != "success" ] && [ "$RETRY_OUTCOME" != "success" ]; then
            echo "::error::Both GitHub Pages deployment attempts failed."
            exit 1
          fi
