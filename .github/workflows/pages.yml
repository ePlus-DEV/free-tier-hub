name: Build and deploy GitHub Pages

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser script syntax
        run: node --check site/assets/site.js
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate source catalog and Markdown
        run: python3 scripts/validate_catalog.py
      - name: Build HTML, sitemap and agent discovery
        env:
          SITE_URL: https://free-tier.eplus.dev/
        run: python3 scripts/build_site.py --output dist
      - name: Verify generated site assets
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/llms.txt
          test -s dist/agents.md
          test -s dist/catalog.json
          test -f dist/.nojekyll
      - name: Verify public-domain SEO URLs
        run: |
          grep -Fq 'rel="canonical" href="https://free-tier.eplus.dev/"' dist/index.html
          grep -Fq '<loc>https://free-tier.eplus.dev/' dist/sitemap.xml
          grep -Fq 'Sitemap: https://free-tier.eplus.dev/sitemap.xml' dist/robots.txt
          grep -Fq 'https://free-tier.eplus.dev/catalog.json' dist/llms.txt
          grep -Fq 'https://free-tier.eplus.dev/catalog.json' dist/agents.md
      - name: Prepare offline PR design preview
        if: github.event_name == 'pull_request'
        run: python3 scripts/prepare_preview.py --site dist --base-url https://free-tier.eplus.dev/
      - name: Upload downloadable PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: free-tier-hub-pr-preview
          path: dist/
          retention-days: 14
      - name: Publish live PR preview to isolated branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -qb "pr-preview-${PR_NUMBER}"
          git add -A
          git commit -qm "Preview PR #${PR_NUMBER} at ${GITHUB_SHA}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/pr-preview-${PR_NUMBER}"
      - name: Add preview link to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- free-tier-hub-pr-preview -->';
            const url = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '#artifacts';
            const live = 'https://raw.githack.com/' + context.repo.owner + '/' + context.repo.repo + '/pr-preview-' + context.issue.number + '/index.html';
            const body = [marker, '### Live design preview (before merge)', '**[Open live preview](' + live + ')** — open directly in browser. First visit may show a one-time safety confirmation from the preview provider.', '', '[Download offline backup](' + url + ') (artifact: free-tier-hub-pr-preview). Preview uses an isolated generated branch; production at free-tier.eplus.dev is unchanged. This temporary preview uses a third-party development proxy, not production hosting.'].join('\n');
            // Paginate and identify by our unique marker, not the API's user.type.
            // The workflow token owns the original github-actions[bot] comment.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100
            });
            const existing = comments.find(c => c.body?.includes(marker) &&
              c.user?.login === 'github-actions[bot]');
            const args = {owner: context.repo.owner, repo: context.repo.repo, body};
            if (existing) {
              await github.rest.issues.updateComment({...args, comment_id: existing.id});
              core.info('Updated existing PR preview comment #' + existing.id);
            } else {
              await github.rest.issues.createComment({...args, issue_number: context.issue.number});
              core.info('Created initial PR preview comment');
            }
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
