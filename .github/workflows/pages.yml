name: Build and deploy GitHub Pages

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - 'README.md'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - 'README.md'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js for catalog verification
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Verify contributor catalog tooling
        run: npm run verify
      - name: Validate browser script syntax
        run: node --check site/assets/site.js
      - name: Assert Node-only repository automation
        run: |
          if find scripts -type f -name '*.py' | grep -q .; then
            echo 'Python scripts remain under scripts/' >&2
            exit 1
          fi
          if grep -REn 'setup-p[y]thon|p[y]thon3' .github/workflows; then
            echo 'Workflow still invokes Python' >&2
            exit 1
          fi
      - name: Build HTML, sitemap and agent discovery
        env:
          SITE_URL: https://free-tier.eplus.dev/
        run: npm run build
      - name: Verify generated site assets
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/llms.txt
          test -s dist/agents.md
          test -s dist/catalog.json
          test -f dist/.nojekyll
      - name: Verify public-domain SEO URLs
        run: |
          grep -Fq 'rel="canonical" href="https://free-tier.eplus.dev/"' dist/index.html
          grep -Fq '<loc>https://free-tier.eplus.dev/' dist/sitemap.xml
          grep -Fq 'Sitemap: https://free-tier.eplus.dev/sitemap.xml' dist/robots.txt
          grep -Fq 'https://free-tier.eplus.dev/catalog.json' dist/llms.txt
          grep -Fq 'https://free-tier.eplus.dev/catalog.json' dist/agents.md
      - name: Prepare offline PR design preview
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-preview.mjs --site dist --base-url https://free-tier.eplus.dev/
      - name: Upload downloadable PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: free-tier-hub-pr-preview
          path: dist/
          retention-days: 14
      - name: Include current open PR previews in production bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-pr-previews.mjs dist
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
