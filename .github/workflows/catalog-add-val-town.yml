name: Apply Val Town catalog update
on:
  push:
    branches: ['catalog/add-val-town-20260923']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog/add-val-town-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update catalog and docs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/services.json')
          data=json.loads(p.read_text())
          assert len(data)==63, len(data)
          assert not any(x['id']=='val-town-free' for x in data)
          data.append({
            'id':'val-town-free',
            'name':'Val Town Free',
            'category':'app-hosting',
            'plan':'ongoing',
            'free_limit':'100,000 runs/day; unlimited public vals; 2,500 vals; cron schedules as often as every 15 minutes',
            'watch_out':'New vals on Free are public; no custom domains; 1-minute execution timeout and 3-day log retention.',
            'pricing_url':'https://www.val.town/pricing',
            'credit_card':'no',
            'commercial_use':'check',
            'last_checked':'2026-09-23'
          })
          p.write_text(json.dumps(data, indent=2)+'\n')
          r=Path('README.md'); s=r.read_text()
          s=s.replace('services-63-brightgreen','services-64-brightgreen',1)
          s=s.replace('| Backend & app hosting | 5 |','| Backend & app hosting | 6 |',1)
          marker='| [Cloudflare Durable Objects Free](https://developers.cloudflare.com/durable-objects/platform/pricing/) | Ongoing free allowance | 100,000 Durable Object requests/day; 13,000 GB-s compute/day; up to 5 GB SQLite-backed storage/account | Workers Free supports only SQLite-backed objects; operations fail when daily quotas are exceeded; Workers request limits apply separately. |'
          row='| [Val Town Free](https://www.val.town/pricing) | Ongoing free allowance | 100,000 runs/day; unlimited public vals; 2,500 vals; cron schedules as often as every 15 minutes | New vals on Free are public; no custom domains; 1-minute execution timeout and 3-day log retention. |'
          assert marker in s
          s=s.replace(marker, marker+'\n'+row,1)
          r.write_text(s)
          d=Path('docs/app-hosting.md'); s=d.read_text()
          marker='| [Appwrite Cloud Free](https://appwrite.io/pricing) | Ongoing free allowance | 2 projects; 5 GB monthly bandwidth; 2 GB storage; 750K executions/month; 75K MAU | Free projects pause after one week of inactivity; 1 database, 1 bucket and 2 functions per project. | Check provider | Check provider |'
          row='| [Val Town Free](https://www.val.town/pricing) | Ongoing free allowance | 100,000 runs/day; unlimited public vals; 2,500 vals; cron schedules as often as every 15 minutes | New vals on Free are public; no custom domains; 1-minute execution timeout and 3-day log retention. | Not required | Check provider |'
          assert marker in s
          d.write_text(s.replace(marker,marker+'\n'+row,1))
          PY
      - name: Run unit and regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate catalog and Markdown
        run: python3 scripts/validate_catalog.py
      - name: Commit verified update and remove temporary workflow
        run: |
          rm .github/workflows/catalog-add-val-town.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/services.json README.md docs/app-hosting.md .github/workflows/catalog-add-val-town.yml
          git commit -m 'catalog: add Val Town Free'
          git push origin HEAD:catalog/add-val-town-20260923
