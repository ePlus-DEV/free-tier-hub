name: Clean merged PR branches and previews

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-pr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only branches belonging to merged PRs
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const protectedBranches = new Set([repository.default_branch]);
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const active = new Set(open.map(pr => pr.head.ref));
            for (const pr of open) active.add('pr-preview-' + pr.number);
            const closed = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', per_page: 100
            });
            const merged = closed.filter(pr => Boolean(pr.merged_at));
            const closedNumbers = new Set(closed.map(pr => pr.number));
            const mergedHeads = new Set(merged
              .filter(pr => pr.head.repo?.full_name === repository.full_name)
              .map(pr => pr.head.ref));
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            const candidates = new Set();
            for (const branch of branches) {
              const name = branch.name;
              if (branch.protected || protectedBranches.has(name) || active.has(name)) continue;

              // Preview snapshots have unrelated Git history and never need merging.
              // Delete only when the corresponding PR is closed (merged OR abandoned).
              const preview = /^pr-preview-(\d+)$/.exec(name);
              if (preview) {
                if (closedNumbers.has(Number(preview[1]))) candidates.add(name);
                continue;
              }

              // Merged PRs are safe to clean even after squash/rebase merges.
              if (mergedHeads.has(name)) {
                candidates.add(name);
                continue;
              }

              // Also clean work branches that are already fully contained in main,
              // even when they never had a PR. Never delete ahead/diverged branches.
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner, repo, base: repository.default_branch, head: name
                });
                if (comparison.ahead_by === 0 &&
                    ['behind', 'identical'].includes(comparison.status)) {
                  candidates.add(name);
                } else {
                  core.info('Kept unmerged branch: ' + name +
                    ' (' + comparison.ahead_by + ' ahead)');
                }
              } catch (error) {
                core.warning('Cannot establish merge status for ' + name +
                  ', keeping branch: ' + error.message);
              }
            }

            for (const name of [...candidates].sort()) {
              const original = branches.find(branch => branch.name === name);
              try {
                // If the branch moved since enumeration, leave it untouched.
                const { data: current } = await github.rest.repos.getBranch({
                  owner, repo, branch: name
                });
                if (current.protected || current.commit.sha !== original.commit.sha) {
                  core.warning('Branch moved or became protected; keeping ' + name);
                  continue;
                }
                await github.rest.git.deleteRef({
                  owner, repo, ref: 'heads/' + name
                });
                core.info('Deleted safe-to-remove branch: ' + name);
              } catch (error) {
                core.warning('Could not delete ' + name + ': ' + error.message);
              }
            }
            core.info('Kept main, protected branches, active PRs, and unmerged work.');
