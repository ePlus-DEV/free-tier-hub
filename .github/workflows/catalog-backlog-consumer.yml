name: Consume reviewed catalog backlog

on:
  workflow_dispatch:
  # Restore one queued candidate when a trusted PR merges into main.
  # Does not change the hourly fallback cadence or the 3-PR limit.
  pull_request:
    types: [closed]
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: consume-reviewed-catalog-backlog
  cancel-in-progress: false

jobs:
  consume:
    # Never run on PR closure without a merge, on forks, or into other bases.
    # The job only checks out reviewed main (never the proposed PR branch).
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Validate source catalog and reviewed backlog
        run: |
          set -euo pipefail
          npm run verify
          npm run catalog:backlog -- --list
      - name: Open one canonical candidate issue, if eligible
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::EPLUS_BOT_TOKEN is required to trigger issue workflows"; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { loadCandidates, listCandidates, fresh } from './scripts/backlog.mjs';

          const repo = process.env.GITHUB_REPOSITORY;
          const api = (endpoint) => JSON.parse(execFileSync(
            'gh', ['api', '--paginate', '--slurp', 'repos/' + repo + '/' + endpoint],
            { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }
          )).flat();
          const openPRs = api('pulls?state=open&per_page=100');
          const openCatalog = openPRs.filter(pr => pr.head?.ref?.startsWith('catalog/add-'));
          if (openCatalog.length >= 3) {
            console.log(openCatalog.length + ' catalog PRs already open; keep backlog queued.');
            process.exit(0);
          }
          const issues = api('issues?state=all&per_page=100');
          const prs = api('pulls?state=all&per_page=100');

          // Resume the oldest trusted Issue skipped by the PR limit before opening
          // a new one. Existing or closed PR branches are never regenerated.
          for (const issue of issues.filter(item => item.state === 'open' &&
              !item.pull_request && item.title?.startsWith('[catalog-candidate] '))
              .sort((a, b) => a.number - b.number)) {
            if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)) continue;
            const id = issue.title.slice('[catalog-candidate] '.length);
            const branch = 'catalog/add-' + id;
            if (prs.some(pr => pr.head?.ref === branch)) continue;
            const existingBranch = execFileSync('git',
              ['ls-remote', '--heads', 'origin', 'refs/heads/' + branch],
              { encoding: 'utf8' }).trim();
            if (existingBranch) continue;
            let candidate;
            try { candidate = JSON.parse(issue.body || ''); } catch { continue; }
            if (candidate?.id !== id || !fresh(candidate)) continue;
            execFileSync('gh', ['workflow', 'run', 'catalog-candidate-queue.yml',
              '--repo', repo, '--ref', 'main', '-f', 'issue_number=' + issue.number],
              { stdio: 'inherit' });
            console.log('Resumed queued candidate Issue #' + issue.number);
            process.exit(0);
          }

          const eligible = new Set(listCandidates());
          if (!eligible.size) {
            console.log('No fresh, uncatalogued backlog entries; no Issue created.');
            process.exit(0);
          }
          for (const candidate of loadCandidates()) {
            if (!eligible.has(candidate.id)) continue;
            const title = '[catalog-candidate] ' + candidate.id;
            const branch = 'catalog/add-' + candidate.id;
            if (issues.some(item => item.title === title)) {
              console.log('Already has an Issue: ' + candidate.id);
              continue;
            }
            if (prs.some(item => item.head?.ref === branch)) {
              console.log('Already has a PR: ' + candidate.id);
              continue;
            }
            const remoteBranch = execFileSync(
              'git', ['ls-remote', '--heads', 'origin', 'refs/heads/' + branch],
              { encoding: 'utf8' }
            ).trim();
            if (remoteBranch) {
              console.log('Existing delivery branch needs inspection: ' + candidate.id);
              continue;
            }
            const path = '/tmp/catalog-candidate-' + candidate.id + '.json';
            fs.writeFileSync(path, JSON.stringify(candidate, null, 2) + '\n');
            const issueUrl = execFileSync(
              'gh', ['issue', 'create', '--repo', repo, '--title', title, '--body-file', path],
              { encoding: 'utf8' }
            ).trim();
            console.log('Created ' + issueUrl + '; catalog-candidate-queue handles PR delivery.');
            process.exit(0);
          }
          console.log('No safely actionable backlog candidate after Issue/PR/branch deduplication.');
          NODE
