name: Catalog discovery one-shot
on:
  push:
    branches: [catalog/add-splunk-observability-20260923-1339]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog/add-splunk-observability-20260923-1339
      - name: Add verified service and regenerate catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/services.json')
          data = json.loads(p.read_text())
          assert len(data) == 66, f'Expected 66 services from main, found {len(data)}'
          assert not any(x['id'] == 'splunk-observability-free' or 'Splunk Observability' in x['name'] for x in data)
          entry = {
            'id': 'splunk-observability-free',
            'name': 'Splunk Observability Cloud Free Edition',
            'category': 'observability',
            'plan': 'ongoing',
            'free_limit': 'Up to 15 hosts with all Observability Cloud platform features; no time limit',
            'watch_out': 'May be throttled and accounts inactive for 30+ days can be deactivated; use is limited to internal business purposes and not service-bureau processing for third parties.',
            'pricing_url': 'https://www.splunk.com/en_us/products/pricing/observability.html',
            'credit_card': 'no',
            'commercial_use': 'yes',
            'last_checked': '2026-09-23'
          }
          # Keep observability entries together, directly after Sentry.
          idx = next(i for i,x in enumerate(data) if x['id'] == 'sentry') + 1
          data.insert(idx, entry)
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python3 scripts/sync_catalog.py
          python3 scripts/validate_catalog.py
          python3 -m unittest discover -s tests -v
          grep -R "https://free-tier.eplus.dev/" README.md site scripts .github docs robots.txt llms.txt agents.md 2>/dev/null >/dev/null || true
          ! grep -R "eplus-dev.github.io/free-tier-hub" README.md site scripts .github docs robots.txt llms.txt agents.md 2>/dev/null
          rm .github/workflows/_catalog-discovery-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/services.json README.md docs .github/workflows/_catalog-discovery-once.yml
          git commit -m "catalog: add Splunk Observability Cloud Free Edition"
          git push origin HEAD:catalog/add-splunk-observability-20260923-1339
